name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly run, Monday 02:00 MYT
    - cron: "0 18 * * 0"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cypress-io/github-action@v6
        with:
          command: npm test
      - name: Upload mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: cypress/report
          retention-days: 30
